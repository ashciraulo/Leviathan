html/export_icon=true
html/custom_html_shell=""
html/head_include="<script>if(location.protocol==='file:'){window.addEventListener('DOMContentLoaded',function(){var d=document.createElement('div');d.style.cssText='position:fixed;inset:0;z-index:99;display:flex;align-items:center;justify-content:center;background:#141022;color:#e8e0d0;font:18px/1.5 sans-serif;text-align:center;padding:24px';d.innerHTML='<p style=\\'max-width:640px\\'>Leviathan can\\'t start from a downloaded folder: browsers only run it from a web address.<br><br>Play it at <a style=\\'color:#7fd3e8\\' href=\\'https://ashciraulo.github.io/Leviathan/\\'>ashciraulo.github.io/Leviathan</a>,<br>or in this folder run <code>python3 -m http.server</code> and open <code>http://localhost:8000</code>.</p>';document.body.appendChild(d);});}</script>\n<style>\n#lv-touch{position:fixed;inset:0;z-index:50;pointer-events:none;display:none;user-select:none;-webkit-user-select:none;touch-action:none}\n#lv-touch.on{display:block}\n#lv-touch .b{position:absolute;pointer-events:auto;border-radius:50%;background:rgba(232,224,208,.16);border:2px solid rgba(232,224,208,.45);color:rgba(232,224,208,.85);font:bold 18px/1 monospace;display:flex;align-items:center;justify-content:center;box-sizing:border-box;touch-action:none}\n#lv-touch .b.down{background:rgba(127,211,232,.4);border-color:rgba(127,211,232,.9)}\n#lv-touch .s{width:44px;height:30px;border-radius:15px;font-size:13px}\n#lv-pad{position:absolute;left:18px;bottom:18px;width:136px;height:136px;border-radius:50%;pointer-events:auto;background:rgba(232,224,208,.1);border:2px solid rgba(232,224,208,.35);box-sizing:border-box;touch-action:none}\n#lv-knob{position:absolute;left:44px;top:44px;width:44px;height:44px;border-radius:50%;background:rgba(232,224,208,.35)}\n</style>\n<script>\n// On-screen controls for phones and tablets (Leviathan web build). They show\n// once the page is touched and press the game's default keys, so every\n// prompt and menu works as with a keyboard. Left: a stick for moving; right:\n// the four action keys and hum; top corners: pause, menu tabs and map.\n(function(){\n  var KEYS={ArrowUp:38,ArrowDown:40,ArrowLeft:37,ArrowRight:39,KeyJ:74,KeyK:75,KeyU:85,KeyI:73,KeyH:72,KeyM:77,KeyQ:81,KeyE:69,Escape:27};\n  var NAMES={ArrowUp:'ArrowUp',ArrowDown:'ArrowDown',ArrowLeft:'ArrowLeft',ArrowRight:'ArrowRight',Escape:'Escape'};\n  function send(code,down){\n    var c=document.getElementById('canvas')||document.querySelector('canvas');\n    if(!c)return;\n    var key=NAMES[code]||code.slice(3).toLowerCase();\n    c.dispatchEvent(new KeyboardEvent(down?'keydown':'keyup',{code:code,key:key,keyCode:KEYS[code],which:KEYS[code],bubbles:true,cancelable:true}));\n  }\n  function build(){\n    var root=document.createElement('div');root.id='lv-touch';\n    // Right: K (talk/use) right, J (sword) bottom, U and I left and top.\n    var R=[['KeyK','K',18,70],['KeyJ','J',70,18],['KeyU','U',122,70],['KeyI','I',70,122]];\n    R.forEach(function(r){var b=btn(r[0],r[1]);b.style.width=b.style.height='52px';b.style.right=r[2]+'px';b.style.bottom=r[3]+'px';root.appendChild(b);});\n    var hum=btn('KeyH','H');hum.style.width=hum.style.height='44px';hum.style.right='18px';hum.style.bottom='176px';root.appendChild(hum);\n    // Stacked down the edges so they stay off the HUD on wide phone screens.\n    var T=[['Escape','Esc','left',10],['KeyQ','Q','left',48],['KeyE','E','left',86],['KeyM','M','right',10]];\n    T.forEach(function(t){var b=btn(t[0],t[1]);b.className+=' s';b.style.top=t[3]+'px';b.style[t[2]]='10px';root.appendChild(b);});\n    var pad=document.createElement('div');pad.id='lv-pad';var knob=document.createElement('div');knob.id='lv-knob';pad.appendChild(knob);root.appendChild(pad);\n    stick(pad,knob);\n    document.body.appendChild(root);\n    return root;\n  }\n  function btn(code,label){\n    var b=document.createElement('div');b.className='b';b.textContent=label;\n    var held=0;\n    function down(e){e.preventDefault();if(!held++){b.classList.add('down');send(code,true);}}\n    function up(e){e.preventDefault();if(held&&!--held||e.type==='touchcancel'){held=0;b.classList.remove('down');send(code,false);}}\n    b.addEventListener('touchstart',function(e){for(var i=0;i<e.changedTouches.length;i++)down(e);},{passive:false});\n    b.addEventListener('touchend',function(e){for(var i=0;i<e.changedTouches.length;i++)up(e);},{passive:false});\n    b.addEventListener('touchcancel',up,{passive:false});\n    return b;\n  }\n  function stick(pad,knob){\n    var id=null,held={};\n    function set(want){\n      ['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].forEach(function(k){\n        if(want[k]&&!held[k])send(k,true);\n        if(!want[k]&&held[k])send(k,false);\n      });\n      held=want;\n    }\n    function move(t){\n      var r=pad.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;\n      var dx=t.clientX-cx,dy=t.clientY-cy,d=Math.sqrt(dx*dx+dy*dy),max=r.width/2-22;\n      var k=d>max?max/d:1;knob.style.transform='translate('+dx*k+'px,'+dy*k+'px)';\n      var want={};\n      if(d>14){\n        // Eight ways: a direction is held when the stick leans within 67.5 degrees of it.\n        var a=Math.atan2(dy,dx),c=Math.cos(a),s=Math.sin(a),lim=0.38;\n        if(c>lim)want.ArrowRight=1;if(c<-lim)want.ArrowLeft=1;if(s>lim)want.ArrowDown=1;if(s<-lim)want.ArrowUp=1;\n      }\n      set(want);\n    }\n    pad.addEventListener('touchstart',function(e){e.preventDefault();if(id===null){var t=e.changedTouches[0];id=t.identifier;move(t);}},{passive:false});\n    pad.addEventListener('touchmove',function(e){e.preventDefault();for(var i=0;i<e.changedTouches.length;i++)if(e.changedTouches[i].identifier===id)move(e.changedTouches[i]);},{passive:false});\n    function end(e){e.preventDefault();for(var i=0;i<e.changedTouches.length;i++)if(e.changedTouches[i].identifier===id||e.type==='touchcancel'){id=null;knob.style.transform='';set({});}}\n    pad.addEventListener('touchend',end,{passive:false});pad.addEventListener('touchcancel',end,{passive:false});\n  }\n  window.addEventListener('DOMContentLoaded',function(){\n    var root=null;\n    window.addEventListener('touchstart',function(){if(!root)root=build();root.classList.add('on');},{passive:true,capture:true});\n    // Typing on a real keyboard hides them again.\n    window.addEventListener('keydown',function(e){if(root&&e.isTrusted)root.classList.remove('on');},true);\n  });\n})();\n</script>\n"
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
progressive_web_app/enabled=false

