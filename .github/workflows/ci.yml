name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  smoke-test:
    name: Godot headless smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GODOT_VERSION: 4.7.2
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true

      - name: Download Godot
        run: |
          curl -fsSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" "$RUNNER_TEMP/godot"
          "$RUNNER_TEMP/godot" --version

      - name: Import project
        run: |
          timeout 300 "$RUNNER_TEMP/godot" --headless --path . --import 2>&1 | tee import.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script" import.log; then
            echo "::error::Script errors during import"
            exit 1
          fi

      - name: Run smoke test
        run: |
          set +e
          timeout 180 "$RUNNER_TEMP/godot" --headless --path . res://tests/smoke_test.tscn 2>&1 | tee test.log
          status=${PIPESTATUS[0]}
          set -e
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script" test.log; then
            echo "::error::Script errors while running"
            exit 1
          fi
          grep -q "SMOKE TEST PASSED" test.log || { echo "::error::Smoke test did not pass (exit $status)"; exit 1; }

      - name: Capture screenshots
        continue-on-error: true
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri libglx-mesa0 > /dev/null
          timeout 120 xvfb-run -a -s "-screen 0 1280x720x24" \
            "$RUNNER_TEMP/godot" --rendering-driver opengl3 --audio-driver Dummy --path . res://tests/screenshots.tscn 2>&1 | tee shots.log
          ls -la screenshots

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/*.png
          if-no-files-found: warn
