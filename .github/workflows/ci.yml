name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to a PR cancels that PR's run still in progress, so only the
# newest commit is tested (and only it can send a failure email). Runs on
# main are never cancelled, so every merge keeps its own result.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  smoke-test:
    name: Godot headless smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GODOT_VERSION: 4.7.2
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true

      - name: Check generated art and text
        # Same script threads run locally before pushing (tools/check.sh).
        run: bash tools/check.sh

      # Cached: GitHub's release downloads sometimes time out (504).
      - name: Cache Godot
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: ~/godot-bin
          key: godot-${{ env.GODOT_VERSION }}-linux

      - name: Download Godot
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          curl -fsSL --retry 8 --retry-delay 15 --retry-all-errors -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          mkdir -p ~/godot-bin
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" ~/godot-bin/godot

      - name: Install Godot
        run: |
          cp ~/godot-bin/godot "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot"
          "$RUNNER_TEMP/godot" --version

      - name: Import project
        run: |
          timeout 300 "$RUNNER_TEMP/godot" --headless --path . --import 2>&1 | tee import.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script" import.log; then
            echo "::error::Script errors during import"
            exit 1
          fi

      - name: Run smoke test
        run: |
          set +e
          timeout 300 "$RUNNER_TEMP/godot" --headless --path . res://tests/smoke_test.tscn 2>&1 | tee test.log
          status=${PIPESTATUS[0]}
          set -e
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script" test.log; then
            echo "::error::Script errors while running"
            exit 1
          fi
          grep -q "SMOKE TEST PASSED" test.log || { echo "::error::Smoke test did not pass (exit $status)"; exit 1; }

      - name: Capture screenshots
        continue-on-error: true
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri libglx-mesa0 > /dev/null
          timeout 120 xvfb-run -a -s "-screen 0 1280x720x24" \
            "$RUNNER_TEMP/godot" --rendering-driver opengl3 --audio-driver Dummy --path . res://tests/screenshots.tscn 2>&1 | tee shots.log
          timeout 120 xvfb-run -a -s "-screen 0 1280x720x24" \
            "$RUNNER_TEMP/godot" --rendering-driver opengl3 --audio-driver Dummy --path . res://tests/menu_screenshots.tscn 2>&1 | tee -a shots.log
          # The same menus with every string 40% longer (long-text check).
          LEVIATHAN_PSEUDO=1 timeout 120 xvfb-run -a -s "-screen 0 1280x720x24" \
            "$RUNNER_TEMP/godot" --rendering-driver opengl3 --audio-driver Dummy --path . res://tests/menu_screenshots.tscn 2>&1 | tee -a shots.log
          ls -la screenshots
          # Also print the PNGs as base64 so they can be read from the job log.
          for f in $(ls screenshots/*.png | grep -v /pseudo_); do
            echo "BEGIN_PNG $(basename "$f")"
            base64 -w 4000 "$f"
            echo "END_PNG"
          done

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/*.png
          if-no-files-found: warn
